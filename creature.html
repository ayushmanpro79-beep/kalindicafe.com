<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cryptopedia.com | Creature Profile</title>
    <link rel="stylesheet" href="./styles.css" />
    <script defer src="./app.js"></script>
  </head>
  <body data-page="creature">
    <div id="moonlit-background" class="moonlit-background" aria-hidden="true"></div>
    <div id="eye-layer" class="eye-layer" aria-hidden="true"></div>
    <div class="site-shell">
      <header id="site-header"></header>
      <main id="app" class="page-root"></main>
      <footer id="site-footer"></footer>
    </div>
    <dialog id="password-dialog" class="password-dialog">
      <form method="dialog" class="password-card" id="password-form">
        <div class="password-card__eyebrow">Secret Archive Access</div>
        <h2>Writer Studio Unlock</h2>
        <p>Enter the archive password to open the hidden console.</p>
        <label class="field">
          <span>Password</span>
          <input id="password-input" type="password" autocomplete="current-password" placeholder="Enter password" />
        </label>
        <div class="dialog-actions">
          <button type="button" class="button button--ghost" data-dialog-close>Cancel</button>
          <button type="submit" class="button button--primary">Unlock</button>
        </div>
        <div id="password-error" class="password-error" aria-live="polite"></div>
      </form>
    </dialog>
    <div id="modal-root"></div>
    <div id="toast-root" class="toast-root" aria-live="polite"></div>
  </body>
</html>
